services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  data_ingestion_service:
    build:
      context: .
      dockerfile: data_ingestion/Dockerfile
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  backend_api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asi_movies-api-1
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: