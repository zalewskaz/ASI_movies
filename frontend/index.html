<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASI Movies - Architektura</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>ASI: Analiza filmów i platform streamingowych</h1>
        <nav>
            <button class="tab-btn active" onclick="switchTab('movies-tab')">Lista filmów</button>
            <button class="tab-btn" onclick="switchTab('stats-tab')">Statystyki</button>
        </nav>
    </header>

    <main>
        <section id="movies-tab" class="tab-content active">
            <div class="filters-container">
                <div class="filter-group">
                    <label for="region-filter">Region:</label>
                    <select id="region-filter">
                        <option value="">Wszystkie</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Platformy:</label>
                    <div id="platform-checkboxes" class="checkbox-list">
                    </div>
                </div>
            </div>

            <div id="movies-grid" class="movies-grid">
                <p>Ładowanie filmów...</p>
            </div>
        </section>

        <section id="stats-tab" class="tab-content">            
            <h3 style="text-align: center; color: #555; margin-top: 40px;">Liczba filmów według platformy</h3>
            <div class="chart-container">
                <canvas id="movieCountChart"></canvas>
            </div>

            <h3 style="text-align: center; color: #555; margin-top: 40px;">Porównanie średnich ocen użytkowników i krytyków</h3>
            <div class="chart-container">
                <canvas id="ratingsChart"></canvas>
            </div>

            <h3 style="text-align: center; color: #555; margin-top: 40px;">Średnia cena subskrypcji</h3>
            <div style="text-align: center;">
                <select id="stats-region-filter" onchange="loadPriceChart()">
                    <option value="">Wszystkie regiony</option>
                    </select>
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
